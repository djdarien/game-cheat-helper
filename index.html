<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#22c55e">
  <link rel="manifest" href="/manifest.json">
  <title>Game Cheat - GoodVibez | Walkthroughs, Maps, Deals & AI Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .chat-bubble { max-width: 85%; }
    .user { background: #3b82f6; color: white; margin-left: auto; }
    .bot { background: #1f2937; color: white; }
    button, input, label { min-height: 44px; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <header class="bg-black p-3 sm:p-4 shadow-lg sticky top-0 z-50">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl sm:text-2xl font-bold text-green-400 flex items-center gap-2">
        <i class="fas fa-gamepad"></i> Game Cheat
        <span class="hidden sm:inline text-sm text-gray-400 font-normal">by GoodVibez</span>
      </h1>
      <button id="installBtn" class="hidden bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-sm">Install App</button>
    </div>
  </header>

  <main class="container mx-auto p-3 sm:p-4 grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6 pb-20 lg:pb-4">
    <div class="lg:col-span-2 space-y-4 sm:space-y-6">
      <div class="bg-gray-800 p-4 sm:p-6 rounded-xl">
        <h2 class="text-lg sm:text-xl font-semibold mb-3 sm:mb-4"><i class="fas fa-search"></i> What game are you playing?</h2>
        <div class="flex flex-col sm:flex-row gap-2">
          <input id="gameInput" type="text" placeholder="e.g. GTA 6, Elden Ring, Fortnite, Minecraft..." 
                 class="flex-1 p-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-green-400 text-base"
                 aria-label="Game name input">
          <button onclick="loadGame()" class="bg-green-500 hover:bg-green-600 active:bg-green-700 px-6 py-3 rounded-lg font-bold text-base w-full sm:w-auto">Load Guides</button>
        </div>
        <div id="quickGames" class="mt-3 sm:mt-4 flex flex-wrap gap-2">
          <button onclick="setGame('GTA 6')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">GTA 6</button>
          <button onclick="setGame('Elden Ring')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">Elden Ring</button>
          <button onclick="setGame('Fortnite')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">Fortnite</button>
          <button onclick="setGame('Minecraft')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">Minecraft</button>
          <button onclick="setGame('Cyberpunk 2077')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">Cyberpunk 2077</button>
          <button onclick="setGame('Red Dead Redemption 2')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">RDR2</button>
          <button onclick="setGame('Valorant')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">Valorant</button>
          <button onclick="setGame('Apex Legends')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">Apex</button>
        </div>
        <div id="recentGames" class="mt-3 text-sm text-gray-400"></div>
      </div>

      <div id="gameContent" class="hidden space-y-4">
        <div class="bg-gray-800 p-4 sm:p-6 rounded-xl">
          <h2 id="gameTitle" class="text-xl sm:text-2xl font-bold text-green-400 mb-3"></h2>
          <div class="flex overflow-x-auto gap-2 mb-4 pb-2">
            <button onclick="showTab('maps')" class="tab-btn bg-blue-600 px-4 py-2 rounded whitespace-nowrap text-sm">Maps</button>
            <button onclick="showTab('guides')" class="tab-btn bg-gray-700 px-4 py-2 rounded whitespace-nowrap text-sm">Guides</button>
            <button onclick="showTab('cheats')" class="tab-btn bg-gray-700 px-4 py-2 rounded whitespace-nowrap text-sm">Cheats</button>
            <button onclick="showTab('deals')" class="tab-btn bg-gray-700 px-4 py-2 rounded whitespace-nowrap text-sm">Deals</button>
          </div>
          <div id="tabContent" class="prose prose-invert max-w-none text-sm sm:text-base overflow-x-auto"></div>
        </div>
      </div>
    </div>

    <div id="chatPanel" class="bg-gray-800 p-4 sm:p-6 rounded-xl lg:sticky lg:top-20">
      <h2 class="text-lg sm:text-xl font-semibold mb-3 flex items-center gap-2">
        <i class="fas fa-robot"></i> Game Helper Chat
        <button onclick="toggleApiKey()" class="ml-auto text-xs bg-gray-700 px-2 py-1 rounded">🔑 API</button>
      </h2>
      <div id="apiKeyPanel" class="hidden mb-3 p-2 bg-gray-900 rounded text-sm">
        <input id="apiKeyInput" type="password" placeholder="xAI / Grok API key" class="w-full p-2 rounded bg-gray-700 mb-1">
        <button onclick="saveApiKey()" class="bg-green-600 px-3 py-1 rounded text-xs">Save</button>
      </div>
      <div id="chatMessages" class="h-80 sm:h-96 overflow-y-auto mb-3 space-y-3 p-2 bg-gray-900 rounded text-sm">
        <div class="chat-bubble bot p-3 rounded-lg">Hi gamer! Load a game or ask me anything. Add an xAI key for full AI power. Install the app for the best experience!</div>
      </div>
      <div class="flex gap-2 mb-2">
        <input id="chatInput" type="text" placeholder="Ask anything..." class="flex-1 p-3 rounded-lg bg-gray-700 border border-gray-600">
        <button onclick="sendChat()" class="bg-blue-500 hover:bg-blue-600 px-4 py-3 rounded-lg"><i class="fas fa-paper-plane"></i></button>
      </div>
      <label class="flex items-center gap-2 cursor-pointer text-sm text-gray-300 py-2">
        <i class="fas fa-camera"></i> Upload stuck screenshot
        <input type="file" id="photoUpload" accept="image/*" class="hidden" onchange="handlePhoto(event)">
      </label>
      <span id="photoStatus" class="text-xs text-green-400"></span>
    </div>
  </main>

  <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-black border-t border-gray-700 z-50 flex justify-around p-2">
    <button onclick="document.getElementById('gameInput').focus()" class="flex flex-col items-center text-xs text-gray-300 py-1"><i class="fas fa-search text-lg"></i>Game</button>
    <button onclick="document.getElementById('chatPanel').scrollIntoView({behavior:'smooth'})" class="flex flex-col items-center text-xs text-gray-300 py-1"><i class="fas fa-comments text-lg"></i>Chat</button>
    <button onclick="showTab('deals')" class="flex flex-col items-center text-xs text-gray-300 py-1"><i class="fas fa-tags text-lg"></i>Deals</button>
  </nav>

  <footer class="bg-black p-4 mt-8 text-center text-gray-500 text-xs sm:text-sm mb-16 lg:mb-0">
    Game Cheat Helper • GoodVibez.life • Lowest deals from G2A, CDKeys, Instant Gaming & more
  </footer>

  <script>
    let currentGame = '';
    let apiKey = localStorage.getItem('xai_api_key') || '';
    let deferredPrompt;
    let recent = JSON.parse(localStorage.getItem('recentGames') || '[]');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').classList.remove('hidden');
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') document.getElementById('installBtn').classList.add('hidden');
        deferredPrompt = null;
      }
    });

    function renderRecent() {
      const el = document.getElementById('recentGames');
      if (recent.length) {
        el.innerHTML = 'Recent: ' + recent.slice(0,5).map(g => `<button onclick="setGame('${g}')" class="underline text-blue-400 mx-1">${g}</button>`).join('');
      }
    }
    renderRecent();

    function setGame(game) {
      document.getElementById('gameInput').value = game;
      loadGame();
    }

    function loadGame() {
      currentGame = document.getElementById('gameInput').value.trim();
      if (!currentGame) return;
      document.getElementById('gameTitle').textContent = currentGame;
      document.getElementById('gameContent').classList.remove('hidden');
      showTab('maps');
      addBotMessage(`Loaded **${currentGame}**. Maps, guides, cheats, and best deals ready!`);
      if (!recent.includes(currentGame)) {
        recent.unshift(currentGame);
        if (recent.length > 8) recent.pop();
        localStorage.setItem('recentGames', JSON.stringify(recent));
        renderRecent();
      }
      if (window.innerWidth < 1024) document.getElementById('gameContent').scrollIntoView({behavior:'smooth'});
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('bg-blue-600', ['maps','guides','cheats','deals'][i] === tab);
        btn.classList.toggle('bg-gray-700', ['maps','guides','cheats','deals'][i] !== tab);
      });
      document.getElementById('tabContent').innerHTML = getTabContent(currentGame, tab);
    }

    function getTabContent(game, tab) {
      const g = game.toLowerCase();
      // (Keep previous specific handlers + add more)
      if (tab === 'maps') {
        if (g.includes('gta')) return `<p>GTA 6 maps:</p><ul class="list-disc pl-5"><li><a href="https://www.gtabase.com/gta-6/maps" class="text-blue-400" target="_blank">GTABase</a></li><li><a href="https://mapgenie.io/grand-theft-auto-vi" class="text-blue-400" target="_blank">MapGenie</a></li></ul>`;
        if (g.includes('elden')) return `<p>Elden Ring:</p><ul class="list-disc pl-5"><li><a href="https://eldenring.wiki.fextralife.com/Interactive+Map" class="text-blue-400" target="_blank">Fextralife Map</a></li></ul>`;
        return `<p>Maps for ${game}:</p><ul class="list-disc pl-5"><li><a href="https://www.ign.com/search?q=${encodeURIComponent(game+' map')}" class="text-blue-400" target="_blank">IGN</a></li><li><a href="https://mapgenie.io" class="text-blue-400" target="_blank">MapGenie</a></li></ul>`;
      }
      if (tab === 'guides') return `<p>Guides for ${game}:</p><ul class="list-disc pl-5"><li><a href="https://www.ign.com/search?q=${encodeURIComponent(game)}" class="text-blue-400" target="_blank">IGN Wiki</a></li><li><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(game+' walkthrough')}" class="text-blue-400" target="_blank">YouTube</a></li><li><a href="https://gamefaqs.gamespot.com" class="text-blue-400" target="_blank">GameFAQs</a></li></ul>`;
      if (tab === 'cheats') return `<p>Cheats & tips for ${game}:</p><ul class="list-disc pl-5"><li><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(game+' cheats')}" class="text-blue-400" target="_blank">Latest videos</a></li><li><a href="https://www.ign.com/search?q=${encodeURIComponent(game+' cheats')}" class="text-blue-400" target="_blank">IGN Cheats</a></li></ul>`;
      if (tab === 'deals') return `<p>Best deals for ${game}:</p><div class="overflow-x-auto"><table class="w-full text-sm"><tr class="bg-gray-700"><th>Site</th><th>Link</th></tr><tr><td>CDKeys</td><td><a href="https://www.cdkeys.com/search?q=${encodeURIComponent(game)}" class="text-blue-400" target="_blank">View</a></td></tr><tr><td>G2A</td><td><a href="https://www.g2a.com/search?query=${encodeURIComponent(game)}" class="text-blue-400" target="_blank">View</a></td></tr><tr><td>Instant Gaming</td><td><a href="https://www.instant-gaming.com/en/search/?query=${encodeURIComponent(game)}" class="text-blue-400" target="_blank">View</a></td></tr></table></div><p class="text-xs text-gray-400 mt-2">Compare live prices — CDKeys and Instant Gaming frequently have the lowest.</p>`;
      return '';
    }

    function addBotMessage(text) {
      const d = document.createElement('div');
      d.className = 'chat-bubble bot p-3 rounded-lg';
      d.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      document.getElementById('chatMessages').appendChild(d);
      document.getElementById('chatMessages').scrollTop = 99999;
    }
    function addUserMessage(text) {
      const d = document.createElement('div');
      d.className = 'chat-bubble user p-3 rounded-lg';
      d.textContent = text;
      document.getElementById('chatMessages').appendChild(d);
      document.getElementById('chatMessages').scrollTop = 99999;
    }

    async function sendChat() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      addUserMessage(msg);
      input.value = '';
      if (apiKey) {
        try {
          const r = await fetch('https://api.x.ai/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
            body: JSON.stringify({
              model: 'grok-beta',
              messages: [{role:'system', content:`Expert game helper for ${currentGame||'any game'}. Give tips, maps, cheats, deals.`},{role:'user', content:msg}],
              max_tokens: 400
            })
          });
          const data = await r.json();
          addBotMessage(data.choices?.[0]?.message?.content || 'No response');
          return;
        } catch(e) { addBotMessage('API error — using fallback.'); }
      }
      setTimeout(() => addBotMessage(`For **${currentGame||'your game'}**: Check the relevant tab or search YouTube. Upload a screenshot if stuck!`), 500);
    }

    function toggleApiKey() { document.getElementById('apiKeyPanel').classList.toggle('hidden'); }
    function saveApiKey() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('xai_api_key', apiKey);
      document.getElementById('apiKeyPanel').classList.add('hidden');
      addBotMessage(apiKey ? 'API key saved!' : 'Key cleared.');
    }

    function handlePhoto(e) {
      if (!e.target.files[0]) return;
      document.getElementById('photoStatus').textContent = 'Uploaded!';
      addUserMessage('[Screenshot of stuck spot]');
      addBotMessage('Describe what you see and I\'ll help locate it or find a guide.');
    }

    document.getElementById('chatInput').addEventListener('keypress', e => { if (e.key==='Enter') sendChat(); });
  </script>
</body>
</html>
